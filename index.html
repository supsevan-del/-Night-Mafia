<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07070b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="مافيا"><meta name="apple-mobile-web-app-capable" content="yes">
<title>مافيا – لعبة الخداع والذكاء</title>
<style>
:root{color-scheme:dark;--bg:#07070b;--cd:rgba(255,255,255,.055);--bd:rgba(255,255,255,.1);--tx:#F3EDE0;--t2:rgba(243,237,224,.6);--red:#D1243A;--rd2:#7a1020;--gold:#D9B44A;--grn:#34C759;--bl:#5AA9FF;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,'Segoe UI','Noto Naskh Arabic',Tahoma,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:var(--tx);-webkit-user-select:text;user-select:text}
#bg{position:fixed;inset:0;z-index:0;transition:opacity 1.2s}
#bgN{background:radial-gradient(70% 45% at 78% 14%,rgba(190,205,255,.22),transparent 60%),radial-gradient(120% 70% at 50% 110%,#1a0b14,transparent 60%),linear-gradient(180deg,#05060f 0%,#0b0d1c 55%,#120a12 100%)}
#bgD{background:radial-gradient(80% 50% at 25% 18%,rgba(255,196,110,.5),transparent 62%),linear-gradient(180deg,#2b2a4a 0%,#8a5a5a 48%,#e0a766 100%);opacity:0}
body[data-ph=day] #bgD{opacity:1}
#sky{position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:0;pointer-events:none;opacity:.9}
#app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:calc(var(--sa) + 10px) 18px calc(var(--sb) + 14px);max-width:560px;margin:auto}
.scr{flex:1;display:flex;flex-direction:column;min-height:0;animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.sc{flex:1;overflow:auto;padding:4px 2px 12px;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
h1{font-size:46px;font-weight:900;letter-spacing:0;text-shadow:0 0 30px rgba(209,36,58,.6)}h2{font-size:22px;font-weight:800}h3{font-size:16px;font-weight:700}
.t2{color:var(--t2)}.c{text-align:center}
.bt{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;border-radius:18px;font-size:18px;font-weight:800;transition:transform .12s}
.bt:active{transform:scale(.97)}.bt.p{background:linear-gradient(180deg,#e0334a,#a51428);box-shadow:0 8px 24px rgba(209,36,58,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.bt.g{background:rgba(255,255,255,.08);border:1px solid var(--bd)}.bt.gold{background:linear-gradient(180deg,#e8c75f,#b8912e);color:#150f02;box-shadow:0 8px 24px rgba(217,180,74,.3)}
.row>.bt{width:auto;flex:1}.bt[disabled]{opacity:.4;pointer-events:none}.bt.s{padding:11px 16px;font-size:15px;border-radius:14px;width:auto}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:20px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.col{display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}.bar .ib{width:42px;height:42px;border-radius:50%;background:var(--cd);border:1px solid var(--bd);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pl{padding:14px 8px;border-radius:16px;background:var(--cd);border:1px solid var(--bd);font-size:16px;font-weight:700;text-align:center;transition:all .15s}
.pl.on{background:rgba(209,36,58,.25);border-color:var(--red);box-shadow:0 0 0 2px rgba(209,36,58,.35)}.pl.dead{opacity:.35;text-decoration:line-through}
.step{display:flex;align-items:center;justify-content:space-between;background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:10px 14px}
.step b{font-size:17px}.step .n{font-size:22px;min-width:34px;text-align:center;font-weight:800}.step button{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);font-size:22px;font-weight:700}
.hero{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.moon{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#cfd8ff 55%,#8f9bd6);box-shadow:0 0 60px rgba(190,205,255,.5);animation:fl 5s ease-in-out infinite}
.sun{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6d6,#ffc866 60%,#ff9a3c);box-shadow:0 0 70px rgba(255,190,100,.7);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.hold{position:relative;width:100%;aspect-ratio:3/4;max-height:52vh;border-radius:28px;overflow:hidden;touch-action:none;border:1px solid var(--bd)}
.cov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:repeating-linear-gradient(135deg,#14141c 0 14px,#101018 14px 28px);font-size:18px;font-weight:700;color:var(--t2);text-align:center;padding:20px}
.rl{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.rl svg{width:104px;height:104px;stroke-width:3.2;filter:drop-shadow(0 0 16px currentColor)}.rl h2{font-size:34px}.rl p{font-size:16px;line-height:1.7;color:rgba(255,255,255,.85)}
.hold.show .cov{display:none}.hold.show .rl{display:flex}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12)}
.ring{position:relative;width:210px;height:210px;margin:0 auto}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
.md{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.md>div{width:100%;max-width:560px;max-height:84vh;overflow:auto;background:#101018;border:1px solid var(--bd);border-radius:26px 26px 0 0;padding:20px 18px calc(var(--sb) + 20px);animation:up .35s}
.li{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--bd);font-size:16px}
.tg{width:54px;height:32px;border-radius:99px;background:rgba(255,255,255,.14);position:relative;transition:.2s;flex:none}.tg::after{content:'';position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--grn)}.tg.on::after{right:25px}
.seg{display:flex;gap:6px}.seg button{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.08);font-size:14px;font-weight:700}.seg .on{background:var(--red)}
.pb{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}.pb i{display:block;height:100%;background:var(--gold);width:0}
.rc{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--cd);border:1px solid var(--bd)}.rc svg{width:38px;height:38px;flex:none;stroke-width:3.2}
.big{font-size:30px;font-weight:900;line-height:1.5}.sm{font-size:15px;line-height:1.8}
.conf{position:fixed;inset:0;pointer-events:none;z-index:15}
.dim{opacity:.4}
</style></head><body data-ph="night">
<div id="bg"><div id="bgN" style="position:absolute;inset:0"></div><div id="bgD" style="position:absolute;inset:0;transition:opacity 1.2s"></div></div>
<svg id="sky" viewBox="0 0 400 140" preserveAspectRatio="none"><path fill="#04040a" d="M0 140V92h18V70h14v22h10V58h22v34h12V76h16v16h14V50h20v42h14V72h18v20h12V40h24v52h10V66h16v26h14V82h12V56h20v36h12V74h16v18h14V62h22v30h10V84h16v56z"/><g fill="#f4c96b" opacity=".7"><rect x="24" y="76" width="3" height="4"/><rect x="62" y="64" width="3" height="4"/><rect x="104" y="82" width="3" height="4"/><rect x="156" y="58" width="3" height="4"/><rect x="198" y="72" width="3" height="4"/><rect x="246" y="52" width="3" height="4"/><rect x="288" y="78" width="3" height="4"/><rect x="332" y="66" width="3" height="4"/><rect x="372" y="88" width="3" height="4"/></g></svg>
<div id="app"></div><div class="md" id="md"><div id="mb"></div></div><canvas class="conf" id="cf"></canvas>
<script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const IC={maf:'<path d="M8 42h48M18 42c0-16 6-24 14-24s14 8 14 24M18 34h28M22 50l10 6 10-6"/>',don:'<path d="M8 38h48M18 38c0-14 6-22 14-22s14 8 14 22M18 31h28"/><circle cx="32" cy="50" r="5"/><path d="M32 45v-4"/>',doc:'<path d="M25 10h14v15h15v14H39v15H25V39H10V25h15z"/>',det:'<circle cx="27" cy="27" r="15"/><path d="M38 38l16 16"/><path d="M20 27h14M27 20v14" opacity=".5"/>',snp:'<circle cx="32" cy="32" r="17"/><path d="M32 6v14M32 44v14M6 32h14M44 32h14"/><circle cx="32" cy="32" r="2.5"/>',grd:'<path d="M32 8l20 8v16c0 14-9 22-20 26C21 54 12 46 12 32V16z"/><path d="M24 32l6 6 11-12"/>',cit:'<circle cx="32" cy="22" r="10"/><path d="M12 56c2-14 11-20 20-20s18 6 20 20"/>'};
const ROLES={cit:{n:'مواطن',t:'c',col:'#d6c9a6',d:'ابحث عن المافيا بين الجميع، وصوّت لإعدام المشتبه بهم نهاراً.'},maf:{n:'مافيا',t:'m',col:'#ff4d63',d:'تقتل المافيا مواطناً كل ليلة. اخدعوا الجميع ولا تنكشفوا.'},don:{n:'الدون',t:'m',col:'#ff7a45',d:'زعيم المافيا. إن استعلم عنك المحقق يظهر لك أنك بريء.'},doc:{n:'الطبيب',t:'c',col:'#4cd68a',d:'تنقذ لاعباً واحداً كل ليلة من القتل.'},det:{n:'المحقق',t:'c',col:'#5aa9ff',d:'كل ليلة تستعلم عن لاعب: هل هو مافيا أم بريء؟'},snp:{n:'القناص',t:'c',col:'#ffd166',d:'تملك رصاصة واحدة طوال اللعبة. إن أصبت بريئاً تموت معه.'},grd:{n:'الحارس',t:'c',col:'#b794f6',d:'تحمي لاعباً: إن استُهدف بالقتل تموت أنت بدلاً منه.'}};
const ORDER=['cit','maf','don','doc','det','snp','grd'];
const svg=(k,st='')=>`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:${ROLES[k].col};${st}">${IC[k]}</svg>`;
const DEF={voice:1,sfx:1,vib:1,reveal:1,camo:1,disc:120,self:1};
let ST={set:{...DEF},stats:{g:0,m:0,c:0},names:[]};
try{const o=JSON.parse(localStorage.getItem('mafia1')||'{}');ST.set={...DEF,...(o.set||{})};ST.stats={...ST.stats,...(o.stats||{})};ST.names=o.names||[]}catch(e){}
const save=()=>{try{localStorage.setItem('mafia1',JSON.stringify(ST))}catch(e){}};
let G=null,N=6,CFG={},scr='splash',tmr=null,fakeT=null;
/* ----- صوت وتأثيرات ----- */
let AC=null;const ac=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return AC};
function tone(f,d=.15,ty='sine',v=.12,at=0,f2){if(!ST.set.sfx||!ac())return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.25,fq=900,v=.3){if(!ST.set.sfx||!ac())return;const n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()}
const SFX={tap:()=>tone(520,.06,'triangle',.06),ok:()=>{tone(440,.1,'triangle',.08);tone(660,.14,'triangle',.08,.08)},night:()=>{tone(110,1.4,'sine',.14);tone(165,1.4,'sine',.08,.1)},dawn:()=>[392,494,587,784].forEach((f,i)=>tone(f,.5,'sine',.09,i*.16)),shot:()=>{noise(.5,1400,.7);tone(90,.3,'sine',.3,0,40)},gavel:()=>{tone(150,.2,'square',.12,0,70);noise(.12,600,.4)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.4,'triangle',.1,i*.14)),lose:()=>[440,370,311,262].forEach((f,i)=>tone(f,.5,'sawtooth',.06,i*.2)),warn:()=>tone(220,.2,'square',.07)};
const sfx=k=>{try{SFX[k]()}catch(e){}};
const vib=p=>{if(ST.set.vib&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
function say(t){if(!ST.set.voice||!window.speechSynthesis)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.9;u.pitch=.8;speechSynthesis.speak(u)}catch(e){}}
function ph(p){document.body.dataset.ph=p}
/* ----- ضبط الأدوار ----- */
function preset(n){const mc=n<=5?1:n<=8?2:n<=11?3:n<=14?4:5,c={cit:0,maf:0,don:0,doc:1,det:1,snp:0,grd:0};c.don=n>=6?1:0;c.maf=mc-c.don;if(n>=9)c.snp=1;if(n>=11)c.grd=1;c.cit=n-(c.maf+c.don+c.doc+c.det+c.snp+c.grd);return c}
const tot=c=>ORDER.reduce((a,k)=>a+c[k],0),mafN=c=>c.maf+c.don;
const okCfg=c=>tot(c)==N&&mafN(c)>=1&&mafN(c)*2<N&&c.cit>=0;
/* ----- الشاشات ----- */
function show(h,cls=''){app.innerHTML=`<div class="scr ${cls}">${h}</div>`}
function go(s){scr=s;({splash,home,setup,names,roles,reveal,night,fakeStep,dawn,day,vote,end,help,stats,settings})[s]()}
function splash(){ph('night');show(`<div class="hero"><div class="moon"></div><h1>مافيا</h1><div class="t2">لعبة الخداع والذكاء</div><div class="pb" style="width:140px;margin-top:20px"><i id="pbi"></i></div></div>`);const p=$('#pbi');p.style.transition='width 1.5s';requestAnimationFrame(()=>p.style.width='100%');setTimeout(()=>{if(scr=='splash')go('home')},1700)}
function home(){ph('night');show(`<div class="hero"><div class="moon" style="width:76px;height:76px"></div><h1>مافيا</h1><div class="t2">المقدّم الذكي لجلسات المافيا · بدون إنترنت</div></div><div class="col"><button class="bt p" data-a="new">▶ لعبة جديدة</button><div class="row"><button class="bt g" data-a="help">📖 كيف تلعب</button><button class="bt g" data-a="stats">📊 إحصاءات</button></div><button class="bt g" data-a="settings">⚙ الإعدادات</button></div>`)}
function setup(){show(`<div class="bar"><button class="ib" data-a="home">›</button><h2>اللاعبون</h2><span style="width:42px"></span></div><div class="sc"><div class="cd c"><div class="t2">عدد اللاعبين</div><div class="row" style="justify-content:center;gap:26px;margin-top:8px"><button class="bt g s" style="width:56px;font-size:26px" data-a="nm">−</button><div style="font-size:64px;font-weight:900;min-width:90px" id="nn">${ar(N)}</div><button class="bt g s" style="width:56px;font-size:26px" data-a="np">+</button></div><div class="t2 sm" style="margin-top:6px">من ٥ إلى ١٨ لاعباً · بالإضافة إلى مقدّم واحد يمسك الهاتف</div></div></div><button class="bt p" data-a="toNames">التالي: الأسماء ‹</button>`)}
function names(){const a=Array.from({length:N},(_,i)=>ST.names[i]||'');show(`<div class="bar"><button class="ib" data-a="setup">›</button><h2>أسماء اللاعبين</h2><span style="width:42px"></span></div><div class="sc col" style="gap:8px">${a.map((v,i)=>`<div class="row"><span class="chip" style="min-width:34px;text-align:center">${ar(i+1)}</span><input class="cd" style="flex:1;padding:12px 14px;font-size:17px" maxlength="14" data-i="${i}" placeholder="لاعب ${ar(i+1)}" value="${esc(v)}"></div>`).join('')}</div><button class="bt p" data-a="toRoles">التالي: الأدوار ‹</button>`)}
function roles(){if(!CFG||tot(CFG)!=N&&!CFG._u)CFG=preset(N);const ok=okCfg(CFG);show(`<div class="bar"><button class="ib" data-a="names">›</button><h2>توزيع الأدوار</h2><button class="ib" data-a="auto" title="تلقائي">↺</button></div><div class="sc col" style="gap:8px">${ORDER.map(k=>`<div class="rc"><span style="width:38px">${svg(k)}</span><div style="flex:1"><b>${ROLES[k].n}</b><div class="t2" style="font-size:12px">${ROLES[k].t=='m'?'فريق المافيا':'فريق المواطنين'}</div></div><div class="step" style="padding:4px 8px;gap:8px"><button data-a="rm" data-k="${k}">−</button><span class="n">${ar(CFG[k])}</span><button data-a="rp" data-k="${k}">+</button></div></div>`).join('')}
<div class="cd c" style="color:${ok?'var(--grn)':'#ff8a8a'}">المجموع ${ar(tot(CFG))} / ${ar(N)} ${ok?'· جاهز ✓':tot(CFG)!=N?'· عدّل ليساوي عدد اللاعبين':'· عدد المافيا يجب أن يكون أقل من النصف'}</div></div><button class="bt p" data-a="deal" ${ok?'':'disabled'}>وزّع الأدوار سراً 🎴</button>`)}
/* ----- بدء اللعبة وكشف الأدوار ----- */
function newGame(){const rs=[];ORDER.forEach(k=>{for(let i=0;i<CFG[k];i++)rs.push(k)});for(let i=rs.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[rs[i],rs[j]]=[rs[j],rs[i]]}
G={pl:rs.map((r,i)=>({id:i,name:(ST.names[i]||'').trim()||'لاعب '+ar(i+1),role:r,alive:true,death:null})),night:0,rv:0,bullet:true,log:[],last:null,cfg:{...CFG},sel:{},over:null};save()}
function reveal(){const i=G.rv,p=G.pl[i];if(i>=G.pl.length){ph('night');show(`<div class="hero"><div style="font-size:70px">🎭</div><h2>اكتمل التوزيع</h2><p class="t2 sm">سلّم الهاتف إلى المقدّم. كل لاعب يعرف دوره الآن.<br>أغمضوا أعينكم عند بدء الليل.</p></div><button class="bt p" data-a="startNight">ابدأ اللعبة · الليلة الأولى 🌙</button>`);return}
const mates=ROLES[p.role].t=='m'?G.pl.filter(q=>ROLES[q.role].t=='m'&&q.id!=p.id).map(q=>q.name):null;
show(`<div class="bar"><span></span><span class="chip">${ar(i+1)} / ${ar(G.pl.length)}</span><span></span></div><div class="hero" style="gap:10px;justify-content:flex-start"><div class="t2">سلّم الهاتف إلى</div><h1 style="font-size:40px">${esc(p.name)}</h1>

const h=$('#hd'),nx=$('#nx');let seen=false;const on=e=>{e.preventDefault();h.classList.add('show');seen=true;sfx('tap');vib(15)},off=()=>{h.classList.remove('show');if(seen)nx.disabled=false};
